services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: 3d_quote_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  orcaslicer-headless:
    image: ghcr.io/leolobato/orcaslicer-headless:latest
    container_name: 3d_quote_slicer
    ports:
      - "8070:8070"
    volumes:
      - slicer_data:/data
      - ./profiles:/opt/orcaslicer/profiles

  quote-service:
    build: .
    container_name: 3d_quote_app
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=Cotizador_3DPrinter;encrypt=true;trustServerCertificate=true
      - SLICER_BASE_URL=http://orcaslicer-headless:8070
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      orcaslicer-headless:
        condition: service_started

volumes:
  mssql_data:
  slicer_data: